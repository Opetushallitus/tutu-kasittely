name: TUTU build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  HUSKY: 0
  AWS_REGION: eu-west-1

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'tutu-backend/**/!(*.md)'
              - '.github/workflows/build-backend.yml'
              - '.github/actions/**'
            frontend:
              - 'tutu-frontend/**'
              - '.github/workflows/build-backend.yml'
              - '.github/actions/**'
          list-files: 'json'

  test-backend:
    needs: filter
    if: github.event_name == 'workflow_dispatch' || needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-scala-env
      - name: Run unit tests
        working-directory: ./tutu-backend
        run: ./mvnw test

  lint-frontend:
    needs: filter
    if: github.event_name == 'workflow_dispatch' || needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-node-env
      - name: Run frontend checks
        working-directory: ./tutu-frontend
        run: |
          pnpm lint
          pnpm prettier
          pnpm typecheck

  playwright:
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-playwright
        if: ${{github.event_name == 'workflow_dispatch' || needs.filter.outputs.frontend == 'true'}}
        with:
          browser: ${{ matrix.browser }}

  build-image:
    needs: [filter, test-backend, lint-frontend, playwright]
    if: ${{ github.actor != 'dependabot[bot]' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-node-env
      - uses: ./.github/actions/prepare-scala-env
      - name: Build frontend dist
        working-directory: ./tutu-frontend
        run: pnpm build
      - name: Stage frontend dist for Docker
        run: |
          rm -rf tutu-backend/frontend-dist
          cp -R tutu-frontend/dist tutu-backend/frontend-dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TUTU_UTILITY_ROLE_ARN }}
          role-session-name: tutu-backend-ecr
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.AWS_TUTU_UTILITY_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
      - uses: docker/setup-buildx-action@v4
      - name: Build and upload image to ECR
        uses: docker/build-push-action@v7
        with:
          context: ./tutu-backend
          cache-from: type=registry,ref=${{ secrets.AWS_TUTU_UTILITY_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/tutu-backend-cache:cache
          cache-to: mode=max,image-manifest=true,oci-mediatypes=true,type=registry,ref=${{ secrets.AWS_TUTU_UTILITY_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/tutu-backend-cache:cache
          file: tutu-backend/Dockerfile
          push: true
          tags: ${{ secrets.AWS_TUTU_UTILITY_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/tutu-backend:ga-${{github.run_number}}
